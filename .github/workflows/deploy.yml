name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      # Encoded AVIF/WebP images from earlier builds, so a deploy only encodes what changed. Only the
      # image folder: the rendered-Markdown store beside it would keep stale HTML after a plugin change.
      - name: Restore the image cache
        uses: actions/cache@v4
        with:
          path: .cache/astro/assets
          key: astro-images-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png', 'src/**/*.webp', 'src/lib/images.ts') }}
          restore-keys: astro-images-
      # What withastro/action did, in steps, so every PDF can be censored between the build and
      # the upload. The CMS already strips phone numbers before it saves a PDF; this is the backstop
      # for one that got in another way. If a PDF can't be cleaned, the deploy stops here and the
      # live site stays as it was.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the PDF censor
        run: pip install -r scripts/requirements.txt
      - name: Test the PDF censor
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Censor phone numbers in published PDFs
        run: python scripts/redact_phones.py dist
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Whatever just went live is locked from now on: a later edit that renames, clears, moves or
  # deletes it fails the build (src/config/locks.json). Add-only; a push made with GITHUB_TOKEN
  # does not start this workflow again.
  lock:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the PDF censor
        run: pip install -r scripts/requirements.txt
      # A PDF with a phone number that reached the repository without going through the CMS (which
      # censors before saving) is replaced by its censored copy, so the current files are clean
      # too. The original stays in the git history: the error below says so, so it can be purged.
      - name: Censor phone numbers in the repository's PDFs
        run: |
          python scripts/redact_phones.py public src | tee censor.log
          if grep -q '^censored ' censor.log; then
            echo "::error::A PDF with a phone number was committed without going through the CMS. The current copy is now censored, but the original is still in the git history; ask for a history purge to remove it."
          fi
          rm censor.log
      - name: Lock newly published addresses and commit censored PDFs
        run: |
          npm run lock
          git add src/config/locks.json public src
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git commit -m "locks and privacy: lock new addresses, censor phone numbers in PDFs"
          git pull --rebase origin main
          git push origin HEAD:main
