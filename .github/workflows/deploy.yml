name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      # Encoded AVIF/WebP images from earlier builds, so a deploy only encodes what changed. Only the
      # image folder: the rendered-Markdown store beside it would keep stale HTML after a plugin change.
      - name: Restore the image cache
        uses: actions/cache@v4
        with:
          path: .cache/astro/assets
          key: astro-images-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png', 'src/**/*.webp', 'src/lib/images.ts') }}
          restore-keys: astro-images-
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Whatever just went live is locked from now on: a later edit that renames, clears, moves or
  # deletes it fails the build (src/config/locks.json). Add-only; a push made with GITHUB_TOKEN
  # does not start this workflow again.
  lock:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lock newly published addresses
        run: |
          npm run lock
          if git diff --quiet -- src/config/locks.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add src/config/locks.json
          git commit -m "locks: lock newly published addresses"
          git pull --rebase origin main
          git push origin HEAD:main
